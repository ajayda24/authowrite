# Run a complete Authowrite instance:
#
#   docker compose up
#
# Then open http://localhost:3000. See docs/self-hosting.md for production
# settings (secrets, email, S3 storage, backups).

services:
  web:
    build: .
    image: authowrite:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgres://authowrite:${POSTGRES_PASSWORD:-authowrite}@db:5432/authowrite
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-long-random-string}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_BUCKET: ${S3_BUCKET:-authowrite}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-authowrite}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-authowrite-secret}
      S3_FORCE_PATH_STYLE: "true"
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Authowrite <no-reply@localhost>}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authowrite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authowrite}
      POSTGRES_DB: authowrite
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authowrite -d authowrite"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional S3-compatible storage. Enable with:
  #   STORAGE_DRIVER=s3 docker compose --profile s3 up
  storage:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-authowrite}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-authowrite-secret}
    volumes:
      - storage-data:/data
    ports:
      - "9001:9001"

  # Creates the bucket for the optional S3 profile.
  storage-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on: [storage]
    entrypoint: >
      sh -c "until mc alias set local http://storage:9000 $${S3_ACCESS_KEY_ID:-authowrite} $${S3_SECRET_ACCESS_KEY:-authowrite-secret}; do sleep 1; done;
             mc mb --ignore-existing local/$${S3_BUCKET:-authowrite}"

volumes:
  db-data:
  uploads:
  storage-data:
